<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>grtr</title>
  <defs>
    <!-- Deep obsidian zinc gradient tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181b" />
      <stop offset="1" stop-color="#09090b" />
    </linearGradient>
    <!-- Apple-grade specular glass rim -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.38" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03" />
    </radialGradient>
    <linearGradient id="limeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)" stroke="#27272a" stroke-width="4" />

  <!-- Glass disk with radial slice dividers -->
  <circle cx="512" cy="512" r="330" fill="url(#sheen)" />
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="4">
    <line x1="512" y1="397" x2="512" y2="182" transform="rotate(22.5 512 512)" />
    <line x1="512" y1="397" x2="512" y2="182" transform="rotate(67.5 512 512)" />
    <line x1="512" y1="397" x2="512" y2="182" transform="rotate(112.5 512 512)" />
    <line x1="512" y1="397" x2="512" y2="182" transform="rotate(157.5 512 512)" />
    <line x1="512" y1="397" x2="512" y2="182" transform="rotate(202.5 512 512)" />
    <line x1="512" y1="397" x2="512" y2="182" transform="rotate(247.5 512 512)" />
    <line x1="512" y1="397" x2="512" y2="182" transform="rotate(292.5 512 512)" />
    <line x1="512" y1="397" x2="512" y2="182" transform="rotate(337.5 512 512)" />
  </g>

  <!-- Active slice (top), in Electric Lime -->
  <path d="M 386 211 A 330 330 0 0 1 638 211 L 556 408 A 115 115 0 0 0 468 408 Z" fill="url(#limeGrad)" />

  <!-- Glass outer rim -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="url(#rim)" stroke-width="8" />

  <!-- Center Hub with the modern 'g' monogram -->
  <circle cx="512" cy="512" r="115" fill="#18181b" />
  <circle cx="512" cy="512" r="115" fill="none" stroke="url(#rim)" stroke-width="5" />

  <!-- Clean geometric 'g' in Lime -->
  <text x="512" y="556" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="130" font-weight="900" fill="#a3e635" letter-spacing="-0.05em">g</text>
</svg>
